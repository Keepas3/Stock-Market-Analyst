name: Refresh data

on:
  schedule:
    - cron: "0 21 * * 1-5" # 9pm UTC, weekdays only -- after US markets close
  workflow_dispatch: {} # manual "Run workflow" button, for on-demand testing

permissions:
  contents: write # needed to push the updated data/stocks.db back

concurrency:
  group: refresh-data
  cancel-in-progress: false # let an in-flight run finish rather than clobbering it

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Refresh data and retrain
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv run python scripts/fetch_historical_data.py
          uv run python scripts/refresh_live_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/stocks.db; then
            git add data/stocks.db
            git commit -m "Automated data refresh"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              # main moved (the other cron or an override commit) -- replay our commit on top.
              # In a rebase, -X theirs keeps OUR replayed commit's version of the binary DB.
              git pull --rebase -X theirs origin main || { git rebase --abort || true; exit 1; }
            done
            echo "Could not push after 3 attempts" >&2
            exit 1
          else
            echo "No changes to data/stocks.db -- nothing to commit"
          fi
