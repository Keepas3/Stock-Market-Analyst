name: Keep Streamlit App Awake

# Streamlit Community Cloud only counts a real browser session (the page's
# JavaScript opening the app's websocket) as activity -- a bare `curl` gets
# a 200 for the static page shell whether the app is awake or asleep, so
# the earlier curl-based version never actually prevented sleeping. This
# drives a headless browser instead (see scripts/keep_alive.py), which also
# clicks "Yes, get this app back up!" if the app is already asleep.

on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours -- well inside the inactivity window
  workflow_dispatch: {}

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app
        run: python scripts/keep_alive.py
