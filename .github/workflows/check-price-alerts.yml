name: Check price alerts

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5" # every 15 min, 13:00-21:00 UTC, weekdays --
      # covers 9:30am-4pm ET across both DST states (9:30am EDT = 13:30 UTC
      # through 4pm EST = 21:00 UTC), with a little pre/post-market overlap
      # that's harmless (no alert fires unless a real threshold is crossed).
  workflow_dispatch: {} # manual "Run workflow" button, for on-demand testing

permissions:
  contents: write # needed to push updated price-alert trigger state back

concurrency:
  group: check-price-alerts
  cancel-in-progress: true # unlike refresh-data.yml's heavy daily job, a
    # stale in-flight run being superseded by a newer one is fine here --
    # this job is cheap, frequent, and only cares about the LATEST price.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Check price alerts
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python scripts/check_price_alerts.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/stocks.db; then
            git add data/stocks.db
            git commit -m "Update price alert state"
            git push
          else
            echo "No changes to data/stocks.db -- nothing to commit"
          fi
