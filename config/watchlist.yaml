# One entry per tracked symbol. Kept small and curated (~15-20 tickers) --
# not a broad index-wide universe -- because Alpha Vantage's free
# NEWS_SENTIMENT tier is a hard 25 requests/day; one sentiment call per
# symbol per daily refresh needs headroom under that cap. Same
# hand-curated shape as soccer-predictor's config/leagues.yaml -- add/
# remove a ticker here any time, no code changes needed.
#
# `sector` is purely descriptive (shown on the dashboard), not used in any
# calculation.
