# One entry per tracked symbol. Previously kept to ~15-20 tickers because
# Alpha Vantage's free NEWS_SENTIMENT tier was a hard 25 requests/day and
# every symbol needed a daily sentiment call. News sentiment now comes
# from Finnhub's company-news endpoint + local VADER scoring instead (see
# ingest/sentiment.py) -- Finnhub's free tier is 60 requests/minute with
# no daily cap, so the list has grown to ~50 curated large/mid-cap names
# spanning more sectors. Still a hand-curated list, not a full index --
# same shape as soccer-predictor's config/leagues.yaml -- add/remove a
# ticker here any time, no code changes needed.
#
# `sector` is purely descriptive (shown on the dashboard), not used in any
# calculation.
